<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main navigation" style="width: 248px; height: 960px; box-sizing: border-box; padding: 22px 14px 16px; display: flex; flex-direction: column; gap: 18px; background: var(--nav-bg, #131A2E); font-family: 'Jost', 'Avenir Next', system-ui, sans-serif; color: var(--nav-ink, #EEF0F6)">
<div style="display: flex; align-items: center; gap: 11px; padding: 0 6px">
<div style="width: 32px; height: 32px; border-radius: 10px; background: var(--nav-accent, #D4B57C); color: var(--on-nav-accent, #131A2E); display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9M12 12c0-4.4 3.1-7.5 7.5-7.5 0 4.4-3.1 7.5-7.5 7.5zM12 15c0-3.3-2.7-6-6.5-6 0 3.8 2.7 6 6.5 6z"></path></svg>
</div>
<div style="font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-size: 23px; font-weight: 600; letter-spacing: 0; line-height: 1">Life Dashboard</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--nav-line, #29314F); border-radius: 10px; background: var(--nav-surface, #1D2542); color: var(--nav-ink-3, #8189A3); font-family: inherit; font-size: 13px; cursor: pointer; text-align: left">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
<span style="flex-grow: 1">Search or jump to…</span>
<kbd style="font-family: inherit; font-size: 11px; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--nav-line, #29314F); color: var(--nav-ink-2, #AFB6CA)">⌘K</kbd>
</button>
<button type="button" style="height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; background: var(--nav-accent, #D4B57C); color: var(--on-nav-accent, #131A2E); font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.01em; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span>Quick capture</span>
<kbd style="font-family: inherit; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--on-nav-accent, #131A2E); color: var(--on-nav-accent, #131A2E)">⌘N</kbd>
</button>
</div>
<sc-for list="{{groups}}" as="group" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 10px 5px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--nav-ink-3, #8189A3)">
<span>{{group.label}}</span>
<span style="font-size: 11px; font-weight: 500; letter-spacing: 0.02em; text-transform: none; font-style: italic">{{group.hint}}</span>
</div>
<sc-for list="{{group.items}}" as="item" hint-placeholder-count="3">
<sc-if value="{{item.isActive}}" hint-placeholder-val="{{false}}">
<a href="{{item.href}}" aria-current="page" style="display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 10px; border-radius: 10px; background: var(--nav-surface, #1D2542); color: var(--nav-ink, #EEF0F6); text-decoration: none; font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--nav-accent, #D4B57C)"><path d="{{item.d}}"></path></svg>
<span style="flex-grow: 1">{{item.label}}</span>
<sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}">
<span style="min-width: 22px; padding: 1px 7px; border-radius: 10px; background: var(--nav-accent, #D4B57C); color: var(--on-nav-accent, #131A2E); font-size: 12px; font-weight: 600; text-align: center">{{item.count}}</span>
</sc-if>
</a>
</sc-if>
<sc-if value="{{item.notActive}}" hint-placeholder-val="{{true}}">
<a href="{{item.href}}" style="display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 10px; border-radius: 10px; color: var(--nav-ink-2, #AFB6CA); text-decoration: none; font-size: 14px; font-weight: 500">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
<span style="flex-grow: 1">{{item.label}}</span>
<sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}">
<span style="min-width: 22px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--nav-line, #29314F); color: var(--nav-ink-2, #AFB6CA); font-size: 12px; font-weight: 600; text-align: center">{{item.count}}</span>
</sc-if>
</a>
</sc-if>
</sc-for>
</div>
</sc-for>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="padding: 12px 14px; border-radius: 12px; border: 1px solid var(--nav-line, #29314F); display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--nav-ink, #EEF0F6)">
<svg width="8" height="8" aria-hidden="true"><circle cx="4" cy="4" r="4" style="fill: var(--nav-success, #79C4A2)"></circle></svg>
<span>Saved on this device</span>
</div>
<div style="font-size: 12px; color: var(--nav-ink-2, #AFB6CA); line-height: 1.45">Synced with 2 devices · 2 min ago</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--nav-ink-2, #AFB6CA)">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>
<span>End-to-end encrypted</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" style="flex-grow: 1; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border: 0; border-radius: 10px; background: transparent; font-family: inherit; color: var(--nav-ink, #EEF0F6); cursor: pointer; text-align: left">
<span style="width: 30px; height: 30px; border-radius: 15px; border: 1px solid var(--nav-accent, #D4B57C); color: var(--nav-accent, #D4B57C); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-size: 17px; font-weight: 600">P</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 13px; font-weight: 600">Personal space</span>
<span style="font-size: 11px; color: var(--nav-ink-3, #8189A3)">Switch to Family</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--nav-ink-3, #8189A3)"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"></path></svg>
</button>
<a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: {{settingsInk}}; background: {{settingsBg}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"></path></svg>
</a>
</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","inbox","tasks","calendar","goals","progress","review","library","vision","finance","health","assistant","settings"],"default":"today"},"$preview":{"width":248,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const I = {
      today: 'M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',
      inbox: 'M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6H3v-6z',
      tasks: 'M9 11l3 3 8-8M20 12v7H4V5h11',
      calendar: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      goals: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2z',
      progress: 'M4 20V11M10 20V5M16 20v-6M3 20h18',
      review: 'M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5',
      library: 'M3 6h6l2 2h10v11H3z',
      vision: 'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M15.5 9.5h.01',
      finance: 'M3 7h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H3zM3 7V6a2 2 0 0 1 2-2h11v3M16 13h2',
      health: 'M3 12h4l2.5-5 3 10 2.5-5H21',
      assistant: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z'
    };
    const mk = (key, label, href, count) => ({
      label, href, d: I[key], count: count || '', hasCount: !!count,
      isActive: active === key, notActive: active !== key
    });
    const groups = [
      { label: 'Plan', hint: '', items: [mk('today', 'Today', 'Main.dc.html', '4'), mk('inbox', 'Inbox', 'Tasks.dc.html', '4'), mk('tasks', 'Tasks', 'Tasks.dc.html'), mk('calendar', 'Calendar', 'Calendar.dc.html')] },
      { label: 'Grow', hint: '', items: [mk('goals', 'Goals', 'Goals.dc.html'), mk('progress', 'Progress', 'Progress.dc.html'), mk('review', 'Weekly review', 'Review.dc.html', 'Sun')] },
      { label: 'Remember', hint: '', items: [mk('library', 'Library & journal', 'Library.dc.html'), mk('vision', 'Vision board', 'Vision.dc.html')] },
      { label: 'Modules', hint: 'optional', items: [mk('finance', 'Finance', 'Finance.dc.html'), mk('health', 'Health', 'Health.dc.html'), mk('assistant', 'Assistant', 'Assistant.dc.html')] }
    ];
    const on = active === 'settings';
    return {
      groups,
      settingsBg: on ? 'var(--nav-surface, #1D2542)' : 'transparent',
      settingsInk: on ? 'var(--nav-accent, #D4B57C)' : 'var(--nav-ink-2, #AFB6CA)'
    };
  }
}
</script>
</body>
</html>
