<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const mood = s.mood == null ? 4 : s.mood;
    const moods = ['Awful', 'Low', 'Okay', 'Good', 'Great'].map((label, i) => ({
      label, selected: mood === i + 1, unselected: mood !== i + 1,
      pick: () => this.setState({ mood: i + 1 })
    }));
    return { theme: this.props.theme ?? 'light', moods };
  }
}
</script>
