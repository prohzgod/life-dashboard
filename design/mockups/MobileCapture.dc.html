<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile: Quick capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0F3;--surface:#FCFCFD;--raised:#FFFFFF;--sunken:#F2F4F7;--sunken-2:#E6E9EF;--subtle:#F6F7F9;--track:#E1E5EC;--line:#DCE1E8;--line-soft:#EAEDF2;--line-strong:#BEC5D2;--control:#858DA0;--ink:#141926;--ink-2:#444B5D;--ink-3:#5F6679;--ink-4:#8E95A7;--inverse:#18203A;--on-inverse:#F6F3EC;--on-inverse-2:#B6BDD0;--inverse-accent:#D4B57C;--primary:#22305A;--primary-hover:#19244A;--on-primary:#F7F4EC;--on-primary-2:#C3CAE0;--primary-soft:#E5E9F4;--primary-softer:#F3F5FA;--primary-ink:#1B2750;--primary-line:#AAB6D6;--link:#2D4585;--accent:#A8844A;--accent-soft:#F3ECDF;--accent-ink:#6B5020;--success:#2B6A52;--success-soft:#E0EEE7;--warning:#92530E;--warning-soft:#F7EBDA;--warning-ink:#613708;--danger:#9E344B;--danger-soft:#F6E2E6;--danger-ink:#72213A;--health:#3E7D63;--health-soft:#E2EFE8;--health-ink:#1E4B3A;--career:#3A5A9A;--career-soft:#E3E9F5;--career-ink:#203766;--finance:#A8742A;--finance-soft:#F6EBDA;--finance-muted:#E4D2B2;--finance-ink:#633F0C;--family:#A04E66;--family-soft:#F6E3E9;--family-ink:#6B243D;--growth:#6A56A8;--growth-soft:#ECE7F7;--growth-ink:#42326C;--home:#2F7C84;--home-soft:#DEEFF1;--home-ink:#1A4A50;--fun:#8F6F10;--fun-soft:#F4EDD3;--fun-ink:#574409;--viz-soft:#AFBEDC;--mood-1:#9A3550;--mood-2:#DDA7AC;--mood-3:#E1E4EB;--mood-4:#9DB1D8;--mood-5:#2C437F;--heat-0:#E4E7EE;--heat-1:#C9D3E8;--heat-2:#93A7D2;--heat-3:#5470AE;--heat-4:#22305A;--nav-bg:#131A2E;--nav-surface:#1D2542;--nav-line:#29314F;--nav-ink:#EEF0F6;--nav-ink-2:#AFB6CA;--nav-ink-3:#8189A3;--nav-success:#79C4A2;--nav-accent:#D4B57C;--on-nav-accent:#131A2E;--shadow-sm:0 1px 2px rgba(20,25,38,0.06), 0 1px 1px rgba(20,25,38,0.03);--shadow-md:0 12px 32px -14px rgba(20,25,38,0.22), 0 2px 6px rgba(20,25,38,0.05);--shadow-primary:0 8px 20px -6px rgba(34,48,90,0.45);--scrim:rgba(10,14,28,0.55);--glass:rgba(252,252,253,0.92)}
[data-theme="dark"]{--bg:#0D111D;--surface:#171C2B;--raised:#313A56;--sunken:#1C2234;--sunken-2:#252C42;--subtle:#131827;--track:#2A3249;--line:#2B334B;--line-soft:#212839;--line-strong:#46506F;--control:#737D9C;--ink:#ECEEF4;--ink-2:#B8BECD;--ink-3:#959CAF;--ink-4:#6A7290;--inverse:#EAE6DC;--on-inverse:#161B2A;--on-inverse-2:#4F566A;--inverse-accent:#7A5B22;--primary:#D4B57C;--primary-hover:#E3C994;--on-primary:#161B2A;--on-primary-2:#4E4128;--primary-soft:#2C2B2C;--primary-softer:#1B2030;--primary-ink:#E8D1A3;--primary-line:#76623D;--link:#D9BC86;--accent:#D4B57C;--accent-soft:#2E2A24;--accent-ink:#E8D1A3;--success:#79C4A2;--success-soft:#18302A;--warning:#E6AB69;--warning-soft:#35291B;--warning-ink:#F2CA94;--danger:#EE91A4;--danger-soft:#3A2029;--danger-ink:#F6BDC8;--health:#76C3A1;--health-soft:#192E27;--health-ink:#AADDC6;--career:#8FA9E2;--career-soft:#1C2644;--career-ink:#C4D3F4;--finance:#E1B173;--finance-soft:#33291C;--finance-muted:#56472F;--finance-ink:#F1CF9D;--family:#E69BB0;--family-soft:#3A2231;--family-ink:#F5C4D2;--growth:#B4A4E9;--growth-soft:#29243F;--growth-ink:#D9D0F7;--home:#7DC7CD;--home-soft:#16303A;--home-ink:#B1E1E4;--fun:#DDBB5B;--fun-soft:#312A17;--fun-ink:#EED88F;--viz-soft:#3F4F7A;--mood-1:#D9728D;--mood-2:#7A4A5A;--mood-3:#2E3650;--mood-4:#4F6DB2;--mood-5:#AFC4F4;--heat-0:#1F2638;--heat-1:#2B3A60;--heat-2:#3F5A98;--heat-3:#7090D2;--heat-4:#BACCF5;--nav-bg:#090C16;--nav-surface:#161C30;--nav-line:#1E2539;--nav-ink:#EEF0F6;--nav-ink-2:#AFB6CA;--nav-ink-3:#7E86A0;--nav-success:#79C4A2;--nav-accent:#D4B57C;--on-nav-accent:#131A2E;--shadow-sm:0 1px 2px rgba(0,0,0,0.45);--shadow-md:0 14px 34px -14px rgba(0,0,0,0.7);--shadow-primary:0 8px 20px -6px rgba(0,0,0,0.6);--scrim:rgba(0,0,0,0.62);--glass:rgba(23,28,43,0.9);color-scheme:dark}
body{margin:0;background:var(--bg)}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--link)}a:hover{color:var(--primary-ink)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: var(--bg); font-family: 'Jost', 'Avenir Next', system-ui, sans-serif; color: var(--ink)">
<div aria-hidden="true" style="padding: 22px 18px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; color: var(--ink-3)">Tue 29 Sep · week 40</span>
<span style="font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-size: 41px; font-weight: 500; font-variant-numeric: lining-nums">Today</span>
<div style="height: 104px; border-radius: 16px; background: var(--surface)"></div>
<div style="height: 94px; border-radius: 16px; background: var(--surface)"></div>
</div>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<section aria-label="Quick capture" style="position: absolute; left: 0; right: 0; bottom: 0; height: 650px; padding: 10px 18px 26px; border-radius: 24px 24px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 14px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--control)"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-size: 29px; font-weight: 500; font-variant-numeric: lining-nums">Quick capture</h1>
<a href="MobileToday.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: var(--sunken); display: flex; align-items: center; justify-content: center; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 12px; background: var(--sunken-2)">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
<sc-if value="{{k.selected}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{k.pick}}" aria-pressed="true" style="height: 40px; border: 0; border-radius: 9px; background: var(--raised); font-size: 13px; font-weight: 700; cursor: pointer">{{k.label}}</button>
</sc-if>
<sc-if value="{{k.unselected}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{k.pick}}" aria-pressed="false" style="height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font-size: 13px; cursor: pointer">{{k.label}}</button>
</sc-if>
</sc-for>
</div>
<textarea rows="3" aria-label="What’s on your mind" style="padding: 14px; border-radius: 14px; border: 1.5px solid var(--primary); background: var(--surface); font-size: 17px; line-height: 1.45; resize: none; outline: none">Pay rent every month on the 1st #finance !high</textarea>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; color: var(--ink-3)">Understood as</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="padding: 6px 10px; border-radius: 8px; background: var(--primary-soft); color: var(--primary-ink); font-size: 13px; font-weight: 600">Task</span>
<span style="padding: 6px 10px; border-radius: 8px; background: var(--primary-soft); color: var(--primary-ink); font-size: 13px; font-weight: 600">Repeats monthly · day 1</span>
<span style="padding: 6px 10px; border-radius: 8px; background: var(--warning-soft); color: var(--warning-ink); font-size: 13px; font-weight: 600">Finance</span>
<span style="padding: 6px 10px; border-radius: 8px; background: var(--family-soft); color: var(--family-ink); font-size: 13px; font-weight: 600">High priority</span>
<span style="padding: 6px 10px; border-radius: 8px; background: var(--sunken-2); color: var(--ink-2); font-size: 13px; font-weight: 600">Next: Thu 1 Oct</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true" style="stroke: var(--ink-2)"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path></svg>Link to a goal</button>
<button type="button" style="height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--ink-2)"><path d="M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6H3v-6z"></path></svg>Inbox</button>
</div>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Take a photo" style="width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--ink-2)"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 10a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path></svg></button>
<button type="button" aria-label="Record a voice note" style="width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--ink-2)"><path d="M9 5a3 3 0 0 1 6 0v6a3 3 0 0 1-6 0zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button type="button" aria-label="Attach from photos" style="width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--ink-2)"><path d="M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6"></path></svg></button>
<a href="MobileToday.dc.html" style="flex-grow: 1; height: 48px; border-radius: 12px; background: var(--primary); color: var(--on-primary); font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Save</a>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--warning-soft); font-size: 13px; line-height: 1.45; color: var(--warning-ink)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M3 3l18 18M8 8a5 5 0 0 0-1 10h10M12 6a5 5 0 0 1 5.9 4.2A4 4 0 0 1 20.5 16"></path></svg>
<span>You’re offline. It’s saved on this phone and will sync when you’re back online.</span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const kind = s.kind || 'Task';
    const kinds = ['Task', 'Note', 'Journal', 'Expense', 'Photo'].map((label) => ({
      label, selected: kind === label, unselected: kind !== label,
      pick: () => this.setState({ kind: label })
    }));
    return { theme: this.props.theme ?? 'light', kinds };
  }
}
</script>
</body>
</html>
