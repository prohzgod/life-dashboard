<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hôm nay · Điện thoại · Đêm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 2160px; overflow: hidden; background: #0F0F16;">
<dc-import name="Phone" bg="night" accent="{{accent}}" hint-size="390px,2160px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","options":["#FF7A45","#FFD25C","#CFF26B","#B9A6FF"],"default":"#B9A6FF","section":"Theme"},"$preview":{"width":390,"height":2160}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent || '#B9A6FF' };
  }
}
</script>
</body>
</html>
