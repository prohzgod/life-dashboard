<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Mục tiêu, công việc, thói quen, ghi nhận mỗi ngày, nhìn lại và thư viện ghi chú. Dùng được khi không có mạng." />
    <meta name="theme-color" content="#F4F1EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F16" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Life Dashboard</title>
    <script>
      // Apply the saved look before first paint so there is no flash. Mirrors resolveAppearance in src/theme/appearance.ts.
      try {
        var root = document.documentElement;
        var mode = localStorage.getItem('life-dashboard:theme');
        var look = JSON.parse(localStorage.getItem('life-dashboard:look') || 'null') || {};
        var bg = /^(dawn|mist|photo|night)$/.test(look.background) ? look.background : 'dawn';
        var accent = /^(tangerine|butter|lime|lavender)$/.test(look.accent) ? look.accent : 'tangerine';
        var dark = bg === 'night' || (mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches));
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.setAttribute('data-bg', dark ? 'night' : bg === 'night' ? 'dawn' : bg);
        root.setAttribute('data-accent', accent);
        // Your own photo loads from the database in a moment; don't flash the sample photo first.
        if (localStorage.getItem('life-dashboard:own-photo')) root.style.setProperty('--bg-image', 'none');
        // Same for the language (src/i18n/locale.ts); Vietnamese is the default.
        if (localStorage.getItem('life-dashboard:locale') === 'en') root.setAttribute('lang', 'en');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
