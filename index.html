<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Goals, tasks, habits, check-ins, reviews and a Library of notes. Works offline." />
    <meta name="theme-color" content="#F8F7F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0F18" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Life Dashboard</title>
    <script>
      // Apply the saved theme before first paint so there is no flash. Mirrors src/theme/theme.ts.
      try {
        var t = localStorage.getItem('life-dashboard:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        // Same for the language (src/i18n/locale.ts); Vietnamese is the default.
        if (localStorage.getItem('life-dashboard:locale') === 'en') document.documentElement.setAttribute('lang', 'en');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
